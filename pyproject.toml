[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitz"
version = "0.1.0"
description = "A beautiful, minimalist TUI for Git."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.2.2",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
gitz = "gitz.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitz"]
